name: Coverage
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install JavaScript dependencies
        run: |
          echo no root package.json
      - name: JavaScript coverage and manifest gate
        run: |
          node scripts/coverage-family-check.mjs
      - name: Coverage manifest gate
        run: node scripts/coverage-family-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-traceability
          path: |
            coverage
            coverage.xml
            tests/coverage-manifest.json
            tests/COVERAGE_MAP.md
            tests/scenarios/coverage-scenarios.json
